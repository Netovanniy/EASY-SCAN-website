<!-- @dsCard group="Slides" viewport="1280x720" name="Data slide" subtitle="Terrain with legends and measurements" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:#000}.slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--bg-page);color:var(--fg-primary)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { MeasurementLine, CoordinateLabel, ScaleBar, NorthIndicator, ElevationLegend, StatBlock, BoundaryLegend } = window.EASYSCANDesignSystem_1b72cd;
const HERO='../../assets/hero-terrain-scan.png';
function Slide(){return(<div className="slide" style={{display:'grid',gridTemplateColumns:'1fr 400px'}}>
  <div style={{position:'relative',overflow:'hidden'}}>
    <img src={HERO} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
    <span style={{position:'absolute',inset:0,background:'var(--scrim-flat)'}}/>
    <MeasurementLine value="184.6" unit="m" length="42%" style={{position:'absolute',left:'14%',top:'70%'}}/>
    <MeasurementLine kind="height" value="38.2" unit="m" orientation="vertical" length="120px" style={{position:'absolute',right:'18%',top:'26%'}}/>
    <span style={{position:'absolute',left:34,top:30}}><CoordinateLabel lat={9.73824} lon={100.01362} elevation={38.2} system="WGS 84 / UTM 47N" overTerrain/></span>
    <span style={{position:'absolute',left:34,bottom:30}}><ScaleBar length={100} unit="m" pixels={150}/></span>
    <span style={{position:'absolute',right:30,top:30}}><NorthIndicator rotation={-12}/></span>
  </div>
  <div style={{background:'var(--bg-surface)',borderLeft:'1px solid var(--border-hairline)',padding:'52px 40px',display:'flex',flexDirection:'column',gap:32}}>
    <div><span style={{fontFamily:'var(--font-information)',fontSize:13,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--fg-muted)'}}>Site · demo data</span>
    <h2 style={{margin:'10px 0 0',fontFamily:'var(--font-structure)',fontWeight:500,fontSize:34,textTransform:'uppercase',letterSpacing:'.03em'}}>The Hill</h2></div>
    <ElevationLegend min={0} max={112} interval={1}/>
    <div style={{display:'flex',gap:36}}>
      <StatBlock value="8.1" unit="ha" label="Area"/>
      <StatBlock value="±25" unit="mm" label="Accuracy" tone="instrument"/>
    </div>
    <BoundaryLegend types={['surveyed','approximate']}/>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Slide/>);
</script></body></html>
