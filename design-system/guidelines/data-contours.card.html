<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
<div><div style="height:120px;background:var(--bg-inset);position:relative;overflow:hidden;border:1px solid var(--border-faint)">
<span style="position:absolute;left:0;right:0;top:7px;height:1.5px;background:var(--contour-major)"></span><span style="position:absolute;left:0;right:0;top:21px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:35px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:49px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:63px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:77px;height:1.5px;background:var(--contour-major)"></span><span style="position:absolute;left:0;right:0;top:91px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:105px;height:0.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:119px;height:0.75px;background:var(--contour-minor)"></span>
</div><div class="lbl" style="margin-top:6px">Over dark surface</div></div>
<div><div style="height:120px;position:relative;overflow:hidden;border:1px solid var(--border-faint)"><img src="../assets/hero-terrain-scan.png" style="width:100%;height:100%;object-fit:cover;display:block">
<span style="position:absolute;left:0;right:0;top:7px;height:1.5px;background:var(--contour-major-over-photo)"></span><span style="position:absolute;left:0;right:0;top:21px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:35px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:49px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:63px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:77px;height:1.5px;background:var(--contour-major-over-photo)"></span><span style="position:absolute;left:0;right:0;top:91px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:105px;height:0.75px;background:var(--contour-minor-over-photo)"></span><span style="position:absolute;left:0;right:0;top:119px;height:0.75px;background:var(--contour-minor-over-photo)"></span>
</div><div class="lbl" style="margin-top:6px">Over photography</div></div>
<div class="es-light"><div style="height:120px;background:#fff;position:relative;overflow:hidden;border:1px solid rgba(13,16,17,.16)">
<span style="position:absolute;left:0;right:0;top:7px;height:1.5px;background:rgba(13,16,17,.62)"></span><span style="position:absolute;left:0;right:0;top:21px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:35px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:49px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:63px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:77px;height:1.5px;background:rgba(13,16,17,.62)"></span><span style="position:absolute;left:0;right:0;top:91px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:105px;height:0.75px;background:rgba(13,16,17,.24)"></span><span style="position:absolute;left:0;right:0;top:119px;height:0.75px;background:rgba(13,16,17,.24)"></span>
</div><div class="lbl" style="margin-top:6px;color:#8E9498">Light mode / print</div></div>
</div>
</body></html>
