<!-- @dsCard group="Data" viewport="700x180" name="Confidence & status" subtitle="Symbol + word + colour — never colour alone" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<div style="display:flex;flex-wrap:wrap;gap:12px 24px">
<span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-measured)"><span>◆</span><span>Measured</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-verified)"><span>✓</span><span>Verified</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-calculated)"><span>ƒ</span><span>Calculated</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-estimated)"><span>≈</span><span>Estimated</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-approximate)"><span>~</span><span>Approximate</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-conceptual)"><span>◇</span><span>Conceptual</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-unavailable)"><span>?</span><span>Unknown</span></span><span style="display:inline-flex;gap:7px;align-items:baseline;font-family:var(--font-information);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--status-unavailable)"><span>—</span><span>Not available</span></span>
</div>
<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
<span style="display:inline-flex;gap:7px;align-items:center;padding:3px 9px;border:1px solid var(--border-hairline);font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-secondary)"><span style="color:var(--scan-scheduled)">○</span>Scheduled</span><span style="display:inline-flex;gap:7px;align-items:center;padding:3px 9px;border:1px solid var(--border-hairline);font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-secondary)"><span style="color:var(--scan-captured)">◐</span>Captured</span><span style="display:inline-flex;gap:7px;align-items:center;padding:3px 9px;border:1px solid var(--border-hairline);font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-secondary)"><span style="color:var(--scan-processing)">◑</span>Processing</span><span style="display:inline-flex;gap:7px;align-items:center;padding:3px 9px;border:1px solid var(--border-hairline);font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-secondary)"><span style="color:var(--scan-ready)">●</span>Ready</span><span style="display:inline-flex;gap:7px;align-items:center;padding:3px 9px;border:1px solid var(--border-hairline);font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-secondary)"><span style="color:var(--scan-updated)">◈</span>Updated</span>
</div>
</body></html>
