<!-- @dsCard group="Spacing" viewport="700x210" name="Motion" subtitle="Scan reveal · contour reveal · point reconstruction" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<style>@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}@keyframes contour{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}</style>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div><div style="height:110px;position:relative;overflow:hidden;border:1px solid var(--border-faint)"><img src="../assets/hero-terrain-scan.png" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;top:0;bottom:0;width:36%;background:linear-gradient(90deg,transparent,rgba(61,227,166,.35),var(--accent-scan));animation:sweep 1.4s cubic-bezier(.65,0,.35,1) infinite"></span></div><div class="lbl" style="margin-top:6px">Scan reveal · 1400ms</div></div>
<div><div style="height:110px;position:relative;overflow:hidden;border:1px solid var(--border-faint);background:var(--bg-inset)"><span style="position:absolute;inset:0;animation:contour 900ms var(--ease-enter) infinite alternate"><span style="position:absolute;left:0;right:0;top:8px;height:1.5px;background:var(--contour-major)"></span><span style="position:absolute;left:0;right:0;top:21px;height:.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:34px;height:.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:47px;height:.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:60px;height:1.5px;background:var(--contour-major)"></span><span style="position:absolute;left:0;right:0;top:73px;height:.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:86px;height:.75px;background:var(--contour-minor)"></span><span style="position:absolute;left:0;right:0;top:99px;height:.75px;background:var(--contour-minor)"></span></span></div><div class="lbl" style="margin-top:6px">Contour reveal · 900ms</div></div>
<div style="display:flex;flex-direction:column;gap:8px;justify-content:center"><div style="font-family:var(--font-information);font-size:11px;line-height:1.7;color:var(--fg-secondary)">cubic-bezier(.22,.61,.36,1)<br>140ms controls · 220ms base<br>No bounce · no overshoot<br>Reduced motion → instant</div></div>
</div>
</body></html>
