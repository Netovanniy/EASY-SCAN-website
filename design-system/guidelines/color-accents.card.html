<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<div class="row">
<div style="flex:1;min-width:0"><div style="height:58px;background:#FF7A3D;border:1px solid var(--border-faint)"></div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary);margin-top:6px">--accent-coral</div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-faint)">#FF7A3D · links, nav active, proposed</div></div>
<div style="flex:1;min-width:0"><div style="height:58px;background:#3DE3A6;border:1px solid var(--border-faint)"></div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary);margin-top:6px">--accent-scan</div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-faint)">#3DE3A6 · measurement, verified, focus</div></div>
<div style="flex:1;min-width:0"><div style="height:58px;background:rgba(255,122,61,.12);border:1px solid var(--border-faint)"></div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary);margin-top:6px">--accent-coral-tint</div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-faint)">12% coral fill</div></div>
<div style="flex:1;min-width:0"><div style="height:58px;background:rgba(61,227,166,.12);border:1px solid var(--border-faint)"></div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary);margin-top:6px">--accent-scan-tint</div><div style="font-family:var(--font-information);font-size:11px;color:var(--fg-faint)">12% green fill</div></div>
</div>
</body></html>
