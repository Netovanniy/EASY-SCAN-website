<!-- @dsCard group="Data" viewport="700x230" name="Semantic data palette" subtitle="Meaning, not decoration — consistent across every surface" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px">
<div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-terrain);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Existing terrain</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-existing-structure);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Existing structures</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-proposed);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Proposed architecture</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-road);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Roads / access</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-vegetation);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Vegetation</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-water);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Water / drainage</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-measure);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Measurements</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-pointcloud);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Point cloud</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-scan-grid);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Scan coverage</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--data-selected);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Selected object</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--status-warning);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Warning / conflict</span></div><div style="display:flex;gap:9px;align-items:center"><span style="width:14px;height:14px;flex:0 0 14px;background:var(--status-unavailable);border:1px solid var(--border-faint)"></span><span style="font-family:var(--font-information);font-size:11px;color:var(--fg-secondary)">Unavailable</span></div>
</div>
</body></html>
