<!-- @dsCard group="Spacing" viewport="700x200" name="Grid in use" subtitle="12 columns · 24px gutters · 56px page gutter" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);color:var(--fg-primary)}.lbl{font-family:var(--font-information);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}.row{display:flex;gap:16px}</style></head><body>

<div style="border:1px solid var(--border-faint);padding:20px 24px">
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:24px;height:60px"><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span><span style="background:rgba(61,227,166,.10);border-top:1px solid var(--accent-scan-dim)"></span></div>
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:16px">
<div style="grid-column:span 7;font-family:var(--font-structure);font-weight:500;font-size:16px;text-transform:uppercase;letter-spacing:.03em">Terrain occupies the wide column</div>
<div style="grid-column:span 5;font-family:var(--font-information);font-size:12px;color:var(--fg-secondary);line-height:1.6">Data explains it in the narrow one. Desktop 12 / tablet 8 / mobile 4.</div>
</div></div>
</body></html>
